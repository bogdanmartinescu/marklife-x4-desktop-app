appId: app.thermalbridge.desktop
productName: ThermalBridge
executableName: ThermalBridge
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
publish:
  provider: github
  owner: bogdanmartinescu
  repo: marklife-x4-desktop-app
  releaseType: release
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  extraResources:
    - from: ../../native/printbridge/target/release/printbridge
      to: printbridge/printbridge
win:
  target:
    - nsis
  extraResources:
    - from: ../../native/printbridge/target/release/printbridge.exe
      to: printbridge/printbridge.exe
linux:
  category: Utility
  desktopName: ThermalBridge
  target:
    - AppImage
    - deb
  extraResources:
    - from: ../../native/printbridge/target/release/printbridge
      to: printbridge/printbridge
